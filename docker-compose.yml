services:
  db:
    image: postgres:15
    container_name: sentinel_db_container
    restart: always
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    container_name: sentinel_app_container
    restart: always
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      # Solo loopback: Caddy (en el host) hace de proxy a localhost:8000.
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: sentinel_dashboard
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      # Solo loopback: se accede por túnel SSH (ssh -L 8501:127.0.0.1:8501 ubuntu@IP).
      - "127.0.0.1:8501:8501"
